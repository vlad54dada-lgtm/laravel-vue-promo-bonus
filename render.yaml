services:
  - type: web
    name: promo-bonus
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # 1 год замість дефолтних 24: кулдаун D7 видно на живому демо,
      # але спільний акаунт не блокується для наступних відвідувачів на добу
      # (кожен рестарт контейнера й так скидає БД сідерами)
      - key: PROMO_COOLDOWN_HOURS
        value: "1"
